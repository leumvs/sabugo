services:
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    env_file:
      - ../.env
    environment:
      FASTAPI_ENV: production
      WEB_DIST: /app/web/dist
      OPENCV_FOR_THREADS_NUM: "2"
    cpus: 2
    mem_limit: 4g
    ports:
      - "${PORT}:${PORT}"
    healthcheck:
      test:
        - CMD
        - .venv/bin/python
        - -c
        - "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ.get('PORT', '3000') + '/api/health', timeout=5)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
