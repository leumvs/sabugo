[project]
name = "sabugo-api"
version = "0.1.0"
description = "Root and fiber image analysis pipeline"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.143.0",
  "numpy>=2.0",
  "opencv-contrib-python-headless>=5.0,<5.1",
  "pydantic>=2.14.0",
  "python-multipart>=0.0.32",
  "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["httpx>=0.28.1", "pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
